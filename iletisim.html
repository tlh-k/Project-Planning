<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim ve Geri Bildirim - Netefor PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #334155;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* NAVBAR */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            gap: 20px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-link {
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #0f172a;
            background-color: #f1f5f9;
        }

        /* FORM CONTAINER */
        .contact-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 40px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-header h1 {
            font-weight: 800;
            font-size: 2rem;
            color: #0f172a;
            margin: 0 0 10px 0;
            letter-spacing: -0.025em;
        }

        .contact-header p {
            color: #64748b;
            font-size: 1rem;
            margin: 0;
        }

        /* FORM STYLES */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            color: #0f172a;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        input[type="file"] {
            background-color: #ffffff;
            padding: 10px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
        }

        /* FOOTER */
        .footer { }
        
        @media (max-width: 600px) {
            .contact-container {
                margin: 20px;
                padding: 25px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="planlayici.html" class="nav-link">Sprint Planlama</a>
        <a href="estimation.html" class="nav-link">Efor Tahmini</a>
        <a href="raporlar.html" class="nav-link">Raporlar</a>
    </div>

    <div class="contact-container">
        <div class="contact-header">
            <h1>Geri Bildirim Gönder</h1>
            <p>Uygulama ile ilgili hata bildirimi, iyileştirme önerisi veya genel düşüncelerinizi bizimle paylaşın.</p>
        </div>

        <!-- Web3Forms Entegrasyonu -->
        <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">
            
            <!-- DİKKAT: Web3Forms üzerinden aldığınız Access Key'i buraya yapıştırın -->
            <input type="hidden" name="access_key" value="17d0860d-48a2-48f4-a475-d699f3dfe9ef">
            
            <input type="hidden" name="subject" value="Netefor PWA - Yeni Geri Bildirim">
            <input type="hidden" name="redirect" value="https://web3forms.com/success">

            <div class="form-group">
                <label for="name">İsim Soyisim</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="Adınızı giriniz">
            </div>

            <div class="form-group">
                <label for="email">E-posta Adresi (Geri dönüş için)</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="ornek@mail.com">
            </div>

            <div class="form-group">
                <label for="message">Mesajınız / Öneriniz</label>
                <textarea id="message" name="message" class="form-control" required placeholder="Karşılaştığınız hatayı veya önerinizi detaylıca yazabilirsiniz..."></textarea>
            </div>

            <div class="form-group">
                <label for="attachment">Ekran Görüntüsü (İsteğe Bağlı)</label>
                <input type="file" id="attachment" name="attachment" class="form-control" accept="image/*, .pdf">
            </div>

            <button type="submit" class="submit-btn">Gönder</button>
        </form>
    </div>

    <!-- Modern Footer -->
    <div class="footer"></div>

</body>
</html>
